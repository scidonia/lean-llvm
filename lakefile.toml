name = "LeanLLVM"
version = "0.1.0"
defaultTargets = ["leanllvm", "ITree"]

# The interaction-tree library is proved against mathlib's QPF support; the
# revision is pinned so a build resolves the same sources everywhere.  Every
# module reaches mathlib only through an adapter under `ITree/Internal/` --
# `PFunctor.lean` for the tree carrier, `FloatingPoint.lean` for the
# arithmetic -- and `tests/itree-boundary.sh` asserts that set.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "LeanLLVM"

# The generic interaction-tree library: no dependency on a `LeanLLVM` module.
[[lean_lib]]
name = "ITree"
roots = ["ITree"]
globs = ["ITree.*"]

[[lean_lib]]
name = "LeanLLVMTest"

[[lean_exe]]
name = "leanllvm"
root = "Main"

# The scalar JSON reference parser's corpus driver; see JsonMain.lean.
[[lean_exe]]
name = "leanllvm-json"
root = "JsonMain"

# Renders the memory-backed loop fixture from its Lean AST; see LoopEmit.lean.
[[lean_exe]]
name = "leanllvm-loop-emit"
root = "LoopEmit"

# Renders the JSON window scanner's authored body from its Lean AST, and (with
# the caller) the scanner's fixtures; see JsonScanEmit.lean.
[[lean_exe]]
name = "leanllvm-json-scan-emit"
root = "JsonScanEmit"

# Renders the JSON seam's staging-caller fixture from its Lean AST; see
# JsonEmit.lean.
[[lean_exe]]
name = "leanllvm-json-emit"
root = "JsonEmit"

# Runs the emitted classifier body over corpus texts; see JsonClassifyMain.lean.
[[lean_exe]]
name = "leanllvm-json-classify"
root = "JsonClassifyMain"

# Runs the stage-1 mask body over corpus windows and the generated arms, so the
# object's rows can be compared with the body's; see JsonS1MasksMain.lean.
[[lean_exe]]
name = "leanllvm-json-s1-masks"
root = "JsonS1MasksMain"

# Runs the entry position bodies over corpus mask streams and the generated
# arms, so the object's rows can be compared with the body's, and emits the
# `ent` word's specification rows; see JsonEntryMain.lean.
[[lean_exe]]
name = "leanllvm-json-entry"
root = "JsonEntryMain"

# The JSON parser's scaling instrument: probes/bench/JsonBench.lean over the
# documents in probes/bench/json/, driven by probes/bench/json-bench.sh.  Its
# scope is the measurement only; it is not part of the library.
[[lean_exe]]
name = "leanllvm-json-bench"
srcDir = "probes/bench"
root = "JsonBench"

# Prints the depth fold's specification over the installation corpus;
# probes/install/DepthMain.lean, compared with the installed object by
# tests/depth-count/check.sh.
[[lean_exe]]
name = "leanllvm-depth-check"
srcDir = "probes/install"
root = "DepthMain"

# Prints the UTF-8 stage's three specification tables; JsonUtf8Main.lean,
# compared with the vendored header's bytes by tests/json-utf8/check.sh.  It is
# not a default target: `lake build` builds the library and `ITree` alone, and
# tests/json-utf8/check.sh names this target when it needs it.
[[lean_exe]]
name = "leanllvm-json-utf8"
root = "JsonUtf8Main"
