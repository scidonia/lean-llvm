name = "LeanLLVM"
version = "0.1.0"
defaultTargets = ["leanllvm", "ITree"]

# The interaction-tree library is proved against mathlib's QPF support; the
# revision is pinned so a build resolves the same sources everywhere.  Every
# module reaches mathlib only through `ITree/Internal/PFunctor.lean`, the one
# adapter that imports it directly.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "3dfb8e22b67042b31fac228dee0e1169a1a7820f"

[[lean_lib]]
name = "LeanLLVM"

# The generic interaction-tree library: no dependency on a `LeanLLVM` module.
[[lean_lib]]
name = "ITree"
roots = ["ITree"]
globs = ["ITree.*"]

[[lean_lib]]
name = "LeanLLVMTest"

[[lean_exe]]
name = "leanllvm"
root = "Main"

# Renders the memory-backed loop fixture from its Lean AST; see LoopEmit.lean.
[[lean_exe]]
name = "leanllvm-loop-emit"
root = "LoopEmit"
